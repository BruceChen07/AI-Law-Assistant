[pytest]
# Default discovery
testpaths = tests

# Windows + pytest-asyncio + starlette TestClient: the unraisable-exception plugin
# can crash the interpreter (access violation) while garbage collecting the
# "<_overlapped object> still has pending operation at deallocation" teardown noise.
# Disable that collector so a full run always produces a stable result.
addopts = -p no:unraisableexception
